# Todo dia às 19h (Brasília) transforma os posts novos do Marqueteiro Casa RP em páginas do site.
# A fonte é um JSON público no bucket (o robô do n8n atualiza após cada post). Nenhuma senha aqui.
name: Novidades do site

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: novidades
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Fixado por commit (v4.2.2), não por etiqueta que pode mudar.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # A chave do GitHub não fica salva no disco enquanto o código roda; só entra no envio.
          persist-credentials: false
      - name: Testes
        run: node --test test/*.test.mjs
      - name: Gerar novidades e sitemap
        run: |
          node ferramentas/novidades.mjs
          node ferramentas/gerar-paginas.mjs
      - name: Publicar se mudou
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add -A novidades
          # Sem novidade nova, não commita (o sitemap muda a data todo dia e viraria commit vazio).
          if git diff --cached --quiet; then echo "nada novo"; exit 0; fi
          git add sitemap.xml
          git config user.name "casa-rp-robo"
          git config user.email "casa-rp-robo@users.noreply.github.com"
          git commit -m "novidades: atualização automática $(TZ=America/Sao_Paulo date +%Y-%m-%d)"
          REMOTO="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Se alguém subiu algo durante a rodada, junta antes de enviar.
          git pull --rebase "$REMOTO" main
          git push "$REMOTO" HEAD:main
